<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FisioFit App</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0A0A0A;
      color: #FAFAFA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 32px;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    .icon {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      background: #FBBF24;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .icon svg {
      width: 56px;
      height: 56px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0 0 12px 0;
    }
    p {
      font-size: 14px;
      color: #A3A3A3;
      line-height: 1.5;
      margin: 0 0 28px 0;
      max-width: 320px;
    }
    button {
      background: #FAFAFA;
      color: #0A0A0A;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div class="icon">
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <path d="M289 96 L160 280 L240 280 L223 416 L352 232 L272 232 Z" fill="#0A0A0A"/>
    </svg>
  </div>
  <h1>Sin conexión</h1>
  <p>FisioFit App necesita internet para funcionar. Comprueba tu conexión y vuelve a intentarlo.</p>
  <button onclick="location.href='https://app.fisiofitteam.com'">Reintentar</button>
</body>
</html>
